services:
  nginx:
    volumes:
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./nginx/conf.d:/etc/nginx/conf.d
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h; done'"

volumes:
  certbot_certs:
