name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend

  backend-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend
      - run: docker compose up -d postgres redis
      - name: Run backend tests
        run: |
          docker compose run --rm backend sh -c "\
            TESTING=1 pytest tests/test_auth.py tests/test_chat.py tests/test_goal_context.py tests/test_prompts.py tests/test_webhooks.py tests/test_documents.py tests/test_knowledge_bases.py tests/test_agents_api.py tests/test_indexing_lock.py tests/test_metrics.py -q --tb=short"
      - if: always()
        run: docker compose down

  frontend-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend test image
        run: docker build --target test -t knowflow-frontend-test ./frontend
      - name: Run frontend tests
        run: docker run --rm knowflow-frontend-test sh -c "npm run test"

  frontend-build:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build frontend

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          ignorefile: '.trivyignore.yaml'

  trivy-image-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - name: Trivy backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'knowflow-fastapi:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          ignorefile: '.trivyignore.yaml'
      - name: Trivy frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'knowflow-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          ignorefile: '.trivyignore.yaml'
